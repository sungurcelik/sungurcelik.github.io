<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopla – Davet / Invite</title>
<meta name="description" content="Arkadaşın seni Hopla'da birlikte zıplamaya çağırıyor. Your friend invites you to jump together in Hopla.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hopla">
<meta property="og:title" content="Hopla'da benimle oyna! · Play Hopla with me!">
<meta property="og:description" content="Dokun ve odama katıl. Tap to join my room.">
<meta property="og:image" content="https://sungurcelik.github.io/hopla/join/icon.png">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta name="twitter:card" content="summary">
<meta name="apple-itunes-app" content="app-id=6832244778">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #fff8f1;
    --card: #ffffff;
    --ink: #2a2140;
    --muted: #6b6180;
    --accent: #e8664a;
    --line: #f0e2d6;
    --sky: linear-gradient(180deg, #3b2a6b 0%, #b54f7a 55%, #f39a5b 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17121f;
      --card: #211a2c;
      --ink: #f3ecff;
      --muted: #b4a9c8;
      --accent: #ff9a72;
      --line: #342a44;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--sky);
    color: #fff;
    padding: 36px 16px 64px;
    text-align: center;
  }
  header img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); }
  .logo {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif;
    font-weight: 800;
    font-size: 40px;
    margin: 10px 0 0;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
  }
  main { max-width: 440px; margin: -40px auto 0; padding: 0 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px 20px; text-align: center; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .code {
    font: 800 34px/1 ui-rounded, "SF Pro Rounded", ui-monospace, monospace;
    letter-spacing: 6px;
    padding: 16px 0 16px 6px;
    border: 2px dashed var(--line);
    border-radius: 16px;
    margin: 0 0 18px;
    user-select: all;
  }
  .button {
    display: block;
    width: 100%;
    margin: 10px 0 0;
    padding: 14px 18px;
    border-radius: 999px;
    border: 0;
    font: 600 17px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-decoration: none;
    cursor: pointer;
  }
  .primary { background: var(--accent); color: #fff; }
  .secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .steps { text-align: left; color: var(--muted); font-size: 15px; margin: 22px 0 0; padding-left: 22px; }
  .steps li { margin: 6px 0; }
  .langs { text-align: center; margin: 20px 0 0; }
  .langs button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; padding: 4px 8px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <p class="logo">Hopla</p>
</header>
<main>
  <div class="card">
    <h1 data-tr="Arkadaşın seni bekliyor!" data-en="Your friend is waiting!"></h1>
    <p class="lead with-code" data-tr="Bu oda koduyla birlikte zıplayın:" data-en="Jump together with this room code:"></p>
    <p class="lead no-code" data-tr="Hopla'yı indir ve arkadaşınla aynı gökyüzünde zıpla." data-en="Get Hopla and jump in the same sky as a friend."></p>
    <div class="code with-code" id="code"></div>
    <a class="button primary with-code" id="open" data-tr="Hopla'yı aç ve katıl" data-en="Open Hopla and join"></a>
    <a class="button secondary" href="https://apps.apple.com/app/id6832244778" data-tr="App Store'dan indir" data-en="Get it on the App Store"></a>
    <button class="button secondary with-code" id="copy" type="button" data-tr="Kodu kopyala" data-en="Copy the code"></button>
    <ol class="steps with-code">
      <li data-tr="Hopla yüklü değilse önce App Store'dan indir." data-en="If you don't have Hopla yet, get it from the App Store first."></li>
      <li data-tr="Sonra bu sayfaya dön ve “Hopla'yı aç ve katıl”a dokun." data-en="Then come back here and tap “Open Hopla and join”."></li>
      <li data-tr="Olmazsa: Arkadaşınla Oyna › Odaya katıl ve kodu yapıştır." data-en="If that fails: Play with a Friend › Join a room, and paste the code."></li>
    </ol>
  </div>
  <div class="langs">
    <button type="button" data-lang="tr">Türkçe</button>
    <button type="button" data-lang="en">English</button>
  </div>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var code = (params.get("c") || "").toUpperCase();
    var valid = /^[A-HJ-NP-Z2-9]{6}$/.test(code);
    document.querySelectorAll(".with-code").forEach(function (e) { e.hidden = !valid; });
    document.querySelectorAll(".no-code").forEach(function (e) { e.hidden = valid; });
    if (valid) {
      document.getElementById("code").textContent = code;
      document.getElementById("open").href = "hopla://join/" + code;
    }

    var copy = document.getElementById("copy");
    var copied = false;
    var buttons = document.querySelectorAll(".langs button");
    var lang = "tr";
    function show(next) {
      lang = next;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-" + lang + "]").forEach(function (e) { e.textContent = e.dataset[lang]; });
      if (copied) copy.textContent = lang === "tr" ? "Kopyalandı ✓" : "Copied ✓";
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    }
    copy.addEventListener("click", function () {
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(code).then(function () { copied = true; show(lang); });
    });
    var asked = params.get("lang");
    show(asked === "tr" || asked === "en" ? asked
      : ((navigator.language || "").toLowerCase().indexOf("tr") === 0 ? "tr" : "en"));
    buttons.forEach(function (b) { b.addEventListener("click", function () { show(b.dataset.lang); }); });
  })();
</script>
</body>
</html>
